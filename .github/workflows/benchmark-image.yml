name: Build National Gallery benchmark image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Canonical commit to build
        required: true
        default: b9045cb9981bd9ef9f78afd2396519b2a20447e0
      image_tag:
        description: Non-serving Fly Registry tag
        required: true
        default: benchmark-2559-b9045cb

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: registry.fly.io
      IMAGE: registry.fly.io/elyio-api
      SOURCE_SHA: ${{ github.event.inputs.source_sha || github.sha }}
      IMAGE_TAG: ${{ github.event.inputs.image_tag || format('benchmark-2559-{0}', github.sha) }}
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify source SHA
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python for frozen benchmark corpus
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reproduce benchmark media corpus
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          python backend/scripts/national_gallery_prepare_recognition_corpus.py \
            --snapshot backend/data/onboarding/national_gallery_london/source_snapshot_2026-08-23.json \
            --selection-manifest backend/data/onboarding/national_gallery_london/controlled_catalog_2559_v1.json \
            --out backend/benchmark_media/corpus_2559_v1 \
            --workers 8 --require-image
          cp backend/benchmark_media/corpus_2559_v1/manifest.json \
            backend/benchmark_media/national_gallery_benchmark_media_2559_v1.json

      - name: Log in to Fly Registry
        uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push benchmark image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: benchmark
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            GIT_COMMIT_SHA=${{ env.SOURCE_SHA }}
            DEPLOYMENT_ENV=benchmark
          cache-from: type=gha,scope=national-gallery-benchmark
          cache-to: type=gha,mode=max,scope=national-gallery-benchmark

      - name: Report immutable image reference
        run: |
          echo "source_sha=$SOURCE_SHA"
          echo "image=${IMAGE}:${IMAGE_TAG}"
